[package]
name = "shardpdf-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Streaming PDF assembler for shardpdf (napi-rs)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node"]
# napi bindings; disable (default-features = false) for pure-Rust use (fuzzing).
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
# No rayon. lopdf's default feature parallelises object-stream parsing on a
# global pool with one thread and stack per core, created on first parse and
# kept for the life of the host process. Measured on the 11,164-page bind
# fixture: 0.16 s with 8 threads, 0.18 s with 2 (a t3.small), 0.22 s with 1
# or without rayon. The 40 ms saved on a 2-vCPU host is not worth a pool
# living inside the caller's process, and rayon-core's thread-spawn panic
# under RLIMIT_AS on aarch64 in CI is exactly the failure a host would not
# expect from a PDF merge. Date crates are dropped too: unused here.
lopdf = { version = "0.44.0", default-features = false }
napi = { version = "3.12.0", features = ["napi9"], optional = true }
napi-derive = { version = "3.6.2", optional = true }

[dev-dependencies]
flate2 = "1"

[build-dependencies]
napi-build = "2.4.0"
