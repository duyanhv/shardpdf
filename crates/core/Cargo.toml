[package]
name = "shardpdf-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Streaming PDF assembler for shardpdf (napi-rs)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node"]
# napi bindings; disable (default-features = false) for pure-Rust use (fuzzing).
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
lopdf = "0.44.0"
napi = { version = "3.12.0", features = ["napi9"], optional = true }
napi-derive = { version = "3.6.2", optional = true }

[build-dependencies]
napi-build = "2.4.0"
