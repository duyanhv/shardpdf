name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install qpdf (test oracle, dev-only)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test the pure-Rust core used by cargo-fuzz
        run: cargo test --manifest-path crates/core/Cargo.toml --no-default-features
      - name: Build native binding (debug)
        working-directory: crates/core
        run: bun run build
      - name: Core JS API tests under Node
        working-directory: crates/core
        run: node --test "test/*.test.js"
      - name: Core JS API tests under Bun (floor-inspector runtime)
        working-directory: crates/core
        run: bun run test:bun
      - name: Orchestrator tests
        working-directory: packages/orchestrator
        run: node --test "test/*.test.ts"
      - name: Install CJK font for the Floor acceptance check
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Consumer smoke (packed tarball, Node + Bun, CJS + ESM, types, Floor acceptance)
        run: bun run smoke:consumer

  prebuild:
    name: Prebuild ${{ matrix.target }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
            build_args: ""
          - host: macos-latest
            target: aarch64-apple-darwin
            build_args: ""
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_args: --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build_args: --use-napi-cross
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build_args: ""
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build_args: ""
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - name: Build native binding
        working-directory: crates/core
        shell: bash
        run: bun run build:release --target ${{ matrix.target }} ${{ matrix.build_args }}
      - name: Upload native binding
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: crates/core/shardpdf-core.*.node
          if-no-files-found: error

  package:
    name: Package and smoke the multi-platform tarball
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install qpdf and a CJK font (acceptance oracle)
        run: sudo apt-get update && sudo apt-get install -y qpdf fonts-noto-cjk
      - run: bun install --frozen-lockfile
      - name: Download every prebuilt binding into the package
        uses: actions/download-artifact@v7
        with:
          pattern: bindings-*
          path: crates/core
          merge-multiple: true
      - name: List bundled bindings
        working-directory: crates/core
        run: ls -la shardpdf-core.*.node
      # native.js tries ./shardpdf-core.<platform>.node before any
      # @shardpdf/core-<platform> package, and package.json "files" includes
      # *.node, so one tarball with every binding needs no per-platform packages.
      - name: Consumer smoke against the release tarball
        run: bun run smoke:consumer
      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: shardpdf-core-tarball
          path: smoke/consumer/vendor/shardpdf-core.tgz
          if-no-files-found: error

  linux-smoke:
    name: Linux consumer smoke (${{ matrix.platform }}, clean in-container build)
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build the binding inside the container and run the consumer smoke
        run: bash smoke/linux/run.sh ${{ matrix.platform }}
